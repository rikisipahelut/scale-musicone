<meta charset="utf-8">

<title>Jarak Nada</title>
<style>
:root{--bg:#eef2f2;--panel:#fff;--ink:#1f2a2a;--teal:#206f78;--muted:#5b6b6b;--line:#d5dede}
@media (prefers-color-scheme:dark){:root{--bg:#141a1a;--panel:#1e2626;--ink:#e6eeee;--muted:#9fb0b0;--line:#2f3a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select{font:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--teal)}
@media (prefers-color-scheme:dark){button.alt{color:#7cc4c9;border-color:#7cc4c9}}
.info{font-size:14px;color:var(--muted);flex-basis:100%;line-height:1.6}
.info b{color:var(--ink)}
main{padding:16px;display:flex;justify-content:center}
#chart{width:100%;max-width:1000px;box-shadow:0 2px 14px rgba(0,0,0,.15);background:#fff}
#chart svg{display:block;width:100%;height:auto}
#chart .note{cursor:pointer}
nav{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 4px}
nav a{font-size:14px;padding:6px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a[aria-current]{color:var(--teal);border-bottom-color:var(--teal);font-weight:bold}
@media (prefers-color-scheme:dark){nav a[aria-current]{color:#7cc4c9;border-bottom-color:#7cc4c9}}
</style>
</head>

const LOGO_VB="0.019252300262451172 0.01285862922668457 4094.5419921875 876.9382934570312";
const KEYS=["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];
const LETTERS="CDEFGAB", NAT=[0,2,4,5,7,9,11];
// each step: [semitones from root, scale degree]; sol = movable-do syllables (Indonesian solmisasi)
const MAJ_SOL=["do","re","mi","fa","so","la","si"];
const mode=k=>({iv:[0,2,4,5,7,9,11,0,2,4,5,7,9,11].slice(k,k+7).map((v,i,a)=>((v-a[0])+12)%12).map((v,i)=>[v,i+1]),sol:[...MAJ_SOL,...MAJ_SOL].slice(k,k+7)});
const SCALES=[
  {t:"Major",id:"mayor",...mode(0)},
  {t:"Natural Minor",id:"minor (natural)",...mode(5)},
  {t:"Harmonic Minor",id:"minor harmonis",iv:[[0,1],[2,2],[3,3],[5,4],[7,5],[8,6],[11,7]],sol:["la","si","do","re","mi","fa","sel"]},
  {t:"Melodic Minor",id:"minor melodis (naik)",iv:[[0,1],[2,2],[3,3],[5,4],[7,5],[9,6],[11,7]],sol:["la","si","do","re","mi","fi","sel"]},
  {t:"Dorian",id:"Dorian",...mode(1)},
  {t:"Phrygian",id:"Phrygian",...mode(2)},
  {t:"Lydian",id:"Lydian",...mode(3)},
  {t:"Mixolydian",id:"Mixolydian",...mode(4)},
  {t:"Locrian",id:"Locrian",...mode(6)},
  {t:"Major Pentatonic",id:"pentatonik mayor",iv:[[0,1],[2,2],[4,3],[7,5],[9,6]],sol:["do","re","mi","so","la"]},
  {t:"Minor Pentatonic",id:"pentatonik minor",iv:[[0,1],[3,3],[5,4],[7,5],[10,7]],sol:["la","do","re","mi","so"]},
  {t:"Blues",id:"blues",iv:[[0,1],[3,3],[5,4],[6,5],[7,5],[10,7]],sol:["la","do","re","ri","mi","so"]},
];
const MAJ_ST=[0,2,4,5,7,9,11];

function build(){
  const key=KEYS[+keySel.value], sc=SCALES[+scaleSel.value];
  const li=LETTERS.indexOf(key[0]);
  const rootPc=(NAT[li]+(key[1]==="#"?1:key[1]==="b"?-1:0)+12)%12;
  const steps=[...sc.iv,[12,8]];
  return steps.map(([st,d],k)=>{
    const L=li+d-1, letter=LETTERS[L%7], oct=Math.floor(L/7);
    const pc=(rootPc+st)%12, acc=((pc-NAT[L%7])%12+18)%12-6;
    const name=letter+(acc>0?"#".repeat(acc):"b".repeat(-acc)).replace("##","x");
    const midi=60+12*oct+NAT[L%7]+acc;
    const degAcc=st%12-MAJ_ST[(d-1)%7];
    const num=(degAcc<0?"♭":degAcc>0?"♯":"")+(((d-1)%7)+1);
    return {name,letter,acc,s:L-2,midi,num,sol:sc.sol[k%sc.sol.length],top:k===steps.length-1};
  });
}

const W=1500,H=1000,X0=62,X1=1437,Y0=457,G=42.5;
let playing=-1;
const accTxt=a=>a===1?"♯":a===-1?"♭":a===2?"𝄪":a===-2?"𝄫":"";
function render(){
  const notes=build(), sc=SCALES[+scaleSel.value], key=KEYS[+keySel.value], solMode=solSel.value;
  const n=notes.length, xa=370, xb=1360, dx=(xb-xa)/(n-1);
  const nx=k=>xa+k*dx, ny=s=>Y0-s*G/2;
  const keyLbl=key.replace("#","♯").replace(/^([A-G])b$/,"$1♭");
  let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">`;
  o+=`<rect width="${W}" height="${H}" fill="#fff"/><rect width="${W}" height="170" fill="#17464f"/>`;
  o+=`<text x="620" y="82" text-anchor="middle" fill="#fff" font-size="58" font-weight="700">Jarak Nada</text>`;
  o+=`<text x="620" y="132" text-anchor="middle" fill="#cfe0e0" font-size="28">Jarak antar nada pada tangga nada ${keyLbl} ${sc.id}</text>`;
  o+=`<svg x="1195" y="40" width="250" height="54" viewBox="${LOGO_VB}"><path fill="#fff" fill-rule="evenodd" d="${LOGO_D}"/></svg>`;
  o+=`<text x="1320" y="117" text-anchor="middle" fill="#cfe0e0" font-size="20">Dibuat oleh Tim Music One</text>`;
  for(let i=0;i<5;i++) o+=`<line x1="${X0}" y1="${Y0-i*G}" x2="${X1}" y2="${Y0-i*G}" stroke="#17464f" stroke-width="3"/>`;
  o+=`<text x="84" y="${Y0+15}" font-size="333" fill="#17464f" font-family="Segoe UI Symbol, Noto Music, Bravura, Arial Unicode MS, serif">𝄞</text>`;
  const ARC_Y=640;
  notes.forEach((nt,k)=>{
    const x=nx(k), y=ny(nt.s), col=k===playing?"#f39a1e":"#17464f";
    o+=`<g class="note" data-k="${k}">`;
    for(let s=-2;s>=nt.s;s-=2) o+=`<line x1="${x-46}" y1="${ny(s)}" x2="${x+46}" y2="${ny(s)}" stroke="#17464f" stroke-width="3"/>`;
    for(let s=10;s<=nt.s;s+=2) o+=`<line x1="${x-46}" y1="${ny(s)}" x2="${x+46}" y2="${ny(s)}" stroke="#17464f" stroke-width="3"/>`;
    if(nt.acc) o+=`<text x="${x-48}" y="${y+16}" text-anchor="middle" font-size="50" fill="${col}">${accTxt(nt.acc)}</text>`;
    o+=`<ellipse cx="${x}" cy="${y}" rx="27" ry="19" transform="rotate(-20 ${x} ${y})" fill="${col}"/>`;
    o+=nt.s<4?`<line x1="${x+25.5}" y1="${y-4}" x2="${x+25.5}" y2="${y-150}" stroke="${col}" stroke-width="3.5"/>`
             :`<line x1="${x-25.5}" y1="${y+4}" x2="${x-25.5}" y2="${y+150}" stroke="${col}" stroke-width="3.5"/>`;
    o+=`<rect x="${x-dx/2}" y="190" width="${dx}" height="${H-200}" fill="transparent"/>`;
    const lbl=nt.name.replace(/#/g,"♯").replace(/b/g,"♭").replace("x","𝄪");
    o+=`<text x="${x}" y="830" text-anchor="middle" font-size="62" font-weight="700" fill="${k===playing?"#f39a1e":"#17464f"}">${lbl}${nt.top?`<tspan font-size="34" dy="-30">1</tspan>`:""}</text>`;
    if(solMode!=="none"){
      const t=solMode==="sol"?nt.sol:nt.num;
      o+=`<text x="${x}" y="920" text-anchor="middle" font-size="${solMode==="sol"?58:52}" fill="#6b7474">${t}</text>`;
      if(solMode==="num"&&nt.top) o+=`<circle cx="${x+(t.length>1?12:0)}" cy="866" r="5" fill="#6b7474"/>`;
    }
    o+=`</g>`;
    if(k<n-1){
      const semis=notes[k+1].midi-nt.midi;
      const lab=semis===1?"½":semis===2?"1":semis===3?"1½":semis===4?"2":(semis/2)+"";
      const c=semis===1?"#c4553a":semis===2?"#206f78":"#e08a1e";
      const x1=x+24,x2=nx(k+1)-24,xm=(x1+x2)/2;
      o+=`<path d="M${x1},${ARC_Y} Q${xm},${ARC_Y+60} ${x2},${ARC_Y}" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`;
      o+=`<text x="${xm}" y="${ARC_Y+100}" text-anchor="middle" font-size="50" font-weight="700" fill="${c}">${lab}</text>`;
    }
  });
  const used=new Set(); for(let k=0;k<n-1;k++) used.add(notes[k+1].midi-notes[k].midi);
  const leg=[[1,"#c4553a","½ = setengah nada (1 fret)"],[2,"#206f78","1 = satu nada (2 fret)"],[3,"#e08a1e","1½ = satu setengah nada (3 fret)"]].filter(l=>used.has(l[0]));
  o+=`<text x="${W/2}" y="${H-22}" text-anchor="middle" font-size="20" fill="#888">`+leg.map(l=>`<tspan fill="${l[1]}" font-weight="700">■</tspan> ${l[2]}`).join("   ·   ")+`   ·   musicone</text>`;
  o+=`</svg>`;
  document.getElementById("chart").innerHTML=o;
  document.querySelectorAll("#chart .note").forEach(g=>g.onclick=()=>playOne(+g.dataset.k));
  const pat=[];for(let k=0;k<n-1;k++){const s=notes[k+1].midi-notes[k].midi;pat.push(s===1?"½":s===2?"1":s===3?"1½":s/2);}
  document.getElementById("info").innerHTML=`<b>Pola jarak:</b> ${pat.join(" – ")} &nbsp;·&nbsp; <b>Nada:</b> ${notes.map(x=>x.name.replace(/#/g,"♯").replace(/b/g,"♭").replace("x","𝄪")).join(" ")} &nbsp;·&nbsp; Klik not untuk mendengar bunyinya. Di gitar: ½ = 1 fret, 1 = 2 fret, 1½ = 3 fret.`;
}

// --- sound ---
let ctx=null, timers=[];
function tone(midi,t0,dur){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const t=ctx.currentTime+t0, f=440*Math.pow(2,(midi-69)/12);
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  const o1=ctx.createOscillator(); o1.type="triangle"; o1.frequency.value=f;
  const o2=ctx.createOscillator(); o2.type="sine"; o2.frequency.value=f*2; const g2=ctx.createGain(); g2.gain.value=.3;
  o1.connect(g); o2.connect(g2).connect(g); g.connect(ctx.destination);
  o1.start(t); o2.start(t); o1.stop(t+dur); o2.stop(t+dur);
}
function stopAll(){timers.forEach(clearTimeout);timers=[];playing=-1;}
function playOne(k){stopAll();tone(build()[k].midi,0,1.2);playing=k;render();timers.push(setTimeout(()=>{playing=-1;render();},500));}
document.getElementById("play").onclick=()=>{
  stopAll(); const notes=build(), step=.5;
  notes.forEach((nt,k)=>{tone(nt.midi,k*step,k===notes.length-1?1.4:.6);timers.push(setTimeout(()=>{playing=k;render();},k*step*1000));});
  timers.push(setTimeout(()=>{playing=-1;render();},notes.length*step*1000+300));
};

function fname(){return ("jarak-nada-"+KEYS[+keySel.value]+"-"+SCALES[+scaleSel.value].t).toLowerCase().replace(/#/g,"sharp").replace(/\s+/g,"-");}
function svgText(){return new XMLSerializer().serializeToString(document.querySelector("#chart svg"));}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
const keySel=document.getElementById("key"), scaleSel=document.getElementById("scale"), solSel=document.getElementById("sol");
KEYS.forEach((k,i)=>keySel.add(new Option(k.replace("#","♯").replace(/^([A-G])b$/,"$1♭"),i)));
SCALES.forEach((s,i)=>scaleSel.add(new Option(s.t,i)));
keySel.value=0; scaleSel.value=0;
[keySel,scaleSel,solSel].forEach(e=>e.onchange=()=>{stopAll();render();});
document.getElementById("svg").onclick=()=>save(new Blob([svgText()],{type:"image/svg+xml"}),fname()+".svg");
document.getElementById("png").onclick=()=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const x=c.getContext("2d");x.scale(2,2);x.drawImage(img,0,0);c.toBlob(b=>save(b,fname()+".png"));};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgText());
};
render();
</script>
