<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingkaran Kuint</title>
<style>
:root{--bg:#eef2f2;--panel:#fff;--ink:#1f2a2a;--teal:#206f78;--deep:#17464f;--muted:#5b6b6b;--line:#d5dede;--accent:#f39a1e;--soft:#e8f0ef}
@media (prefers-color-scheme:dark){:root{--bg:#141a1a;--panel:#1e2626;--ink:#e6eeee;--muted:#9fb0b0;--line:#2f3a3a;--soft:#25302f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .hint{font-size:13px;color:var(--muted);margin-right:auto}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--teal)}
@media (prefers-color-scheme:dark){button.alt{color:#7cc4c9;border-color:#7cc4c9}}
main{padding:16px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
#chart{flex:1 1 560px;max-width:720px;box-shadow:0 2px 14px rgba(0,0,0,.15);background:#fff}
#chart svg{display:block;width:100%;height:auto}
#chart .seg{cursor:pointer}
#chart .seg:hover path{filter:brightness(1.08)}
#panel{flex:1 1 320px;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;line-height:1.5}
#panel h2{margin:0 0 4px;font-size:26px;color:var(--teal)}
@media (prefers-color-scheme:dark){#panel h2{color:#7cc4c9}}
#panel h3{margin:18px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
#panel .sig{font-size:15px}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes span{min-width:38px;text-align:center;padding:4px 8px;border-radius:6px;background:var(--soft);font-weight:600}
.notes span.root{background:var(--accent);color:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td.rn{font-family:Georgia,serif;font-weight:700;width:52px}
td.dim{color:var(--muted)}
ul{margin:0;padding-left:18px}
.swap{margin-top:6px;font-size:13px;padding:4px 10px}
.empty{color:var(--muted)}
nav{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 4px}
nav a{font-size:14px;padding:6px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a[aria-current]{color:var(--teal);border-bottom-color:var(--teal);font-weight:bold}
@media (prefers-color-scheme:dark){nav a[aria-current]{color:#7cc4c9;border-bottom-color:#7cc4c9}}
</style>
</head>

2l3.14 49.39 136.05 -0.11 1.62 -457.34 -137.82 -2.91c-7.68,57.98 -2.06,151.94 -1.94,213.15 0.09,49.74 2.95,128.99 -83.26,129.87 -126.97,1.3 -78.27,-168.16 -88.75,-340.12l-136.75 -3.09c-6.38,95 -13.59,318.58 27.3,386.99 57.35,95.92 211.02,105.93 280.42,24.19z M1531.51 751.77c-18.07,11.56 -44.46,23.28 -77.06,14.03 -34.4,-9.76 -31.64,-24.66 -51.17,-49.29l-131.51 -0.36c-6.12,50.59 32.58,89.7 55.04,110.65 78.77,73.45 312.83,77.41 341.89,-66.77 24.51,-121.6 -76.83,-145.64 -167.97,-168.74 -162.04,-41.08 -60.95,-96.13 -5.08,-79.76 26.7,7.82 33.51,23.72 42.83,47.94l124.88 0.94c-2.84,-222.98 -404.01,-205.87 -378.58,7.23 5.61,46.99 27.34,65.12 59.51,83.3 86.53,48.89 197.97,21.32 187.21,100.84z M2409.88 702.86l-134.71 -0.01c-28.3,10.85 -28.57,68.5 -104.67,47.96 -105,-28.34 -77.68,-273.75 55.7,-219.69 33.73,13.67 20.39,19.83 42.88,44.15l142.86 1.03c-38.89,-255.17 -451.53,-231.41 -449.03,64.19 1.98,233.73 245.21,280.77 363.88,198.16 31.56,-21.97 85.53,-71.42 83.1,-135.8z";
const LOGO_VB="0.019252300262451172 0.01285862922668457 4094.5419921875 876.9382934570312";

// Clockwise from C. alt = enharmonic spelling shown under the main name.
const MAJ=[{n:"C"},{n:"G"},{n:"D"},{n:"A"},{n:"E"},{n:"B",alt:"Cb"},{n:"Gb",alt:"F#"},{n:"Db",alt:"C#"},{n:"Ab"},{n:"Eb"},{n:"Bb"},{n:"F"}];
const MIN=["A","E","B","F#","C#","G#","Eb","Bb","F","C","G","D"];
const LETTERS="CDEFGAB", NAT=[0,2,4,5,7,9,11], PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SHARPS="FCGDAEB", FLATS="BEADGCF";
const pcOf=n=>(PC[n[0]]+(n.slice(1).split("").reduce((a,c)=>a+(c==="#"?1:c==="b"?-1:0),0))+12)%12;
function scale(root,steps){ // spell a 7-note scale letter by letter
  const li=LETTERS.indexOf(root[0]); let pc=pcOf(root);
  return steps.map((s,d)=>{ if(d) pc=(pc+steps[d-1])%12;
    const L=LETTERS[(li+d)%7], acc=((pc-NAT[(li+d)%7])%12+18)%12-6;
    return L+(acc>0?"#".repeat(acc):"b".repeat(-acc)); });
}
const MAJ_STEPS=[2,2,1,2,2,2,1], MIN_STEPS=[2,1,2,2,1,2,2];
function signature(notes){
  const s=notes.filter(n=>n.includes("#")).map(n=>n[0]), f=notes.filter(n=>n.includes("b")).map(n=>n[0]);
  if(s.length) return {txt:`${s.length} kres (#)`,list:[...SHARPS].filter(l=>s.includes(l)).map(l=>l+"#")};
  if(f.length) return {txt:`${f.length} mol (b)`,list:[...FLATS].filter(l=>f.includes(l)).map(l=>l+"b")};
  return {txt:"Tanpa kres/mol",list:[]};
}

let sel=null; // {ring:"maj"|"min", i:index, alt:bool}
const W=1200,H=1420,CX=600,CY=795,R=570,RM=374,RC=207;
const pt=(r,a)=>[CX+r*Math.sin(a*Math.PI/180),CY-r*Math.cos(a*Math.PI/180)];
function sector(r1,r2,a1,a2){
  const [x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r2},${r2} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${r1},${r1} 0 0 0 ${x4.toFixed(1)},${y4.toFixed(1)}Z`;
}
// which segments relate to the selection: I/IV/V on one ring, ii/iii/vi on the other
function roles(){
  if(!sel) return null;
  const k=sel.i, near=[(k+11)%12,(k+1)%12];
  return {main:sel.ring, k, near};
}
function render(){
  const ro=roles();
  const fillMaj=i=>!ro?"#206f78":(ro.main==="maj"&&i===ro.k)?"#f39a1e":(ro.main==="maj"?ro.near.includes(i):[ro.k,...ro.near].includes(i))?"#e7a24a":"#1d5860";
  const fillMin=i=>!ro?"#e8f0ef":(ro.main==="min"&&i===ro.k)?"#f39a1e":(ro.main==="min"?ro.near.includes(i):[ro.k,...ro.near].includes(i))?"#fbd9a6":"#dde6e5";
  const txtMaj=i=>!ro||fillMaj(i)!=="#1d5860"?"#fff":"#9fc0c2";
  const txtMin=i=>!ro?"#17464f":(ro.main==="min"&&i===ro.k)?"#fff":fillMin(i)==="#dde6e5"?"#8aa0a2":"#17464f";
  let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">`;
  o+=`<rect width="${W}" height="${H}" fill="#fff"/><rect width="${W}" height="165" fill="#17464f"/>`;
  o+=`<text x="560" y="82" text-anchor="middle" fill="#fff" font-size="62" font-weight="700">Lingkaran Kuint</text>`;
  o+=`<text x="560" y="128" text-anchor="middle" fill="#cfe0e0" font-size="26">Key mayor di luar, relative minor di dalam</text>`;
  o+=`<svg x="955" y="48" width="205" height="44" viewBox="${LOGO_VB}"><path fill="#fff" fill-rule="evenodd" d="${LOGO_D}"/></svg>`;
  o+=`<text x="1057" y="118" text-anchor="middle" fill="#cfe0e0" font-size="17">Dibuat oleh Tim Music One</text>`;
  for(let i=0;i<12;i++){
    const a1=i*30-15,a2=i*30+15,m=MAJ[i];
    const [x,y]=pt((R+RM)/2,i*30), up=m.alt?16:0;
    o+=`<g class="seg" data-ring="maj" data-i="${i}"><path d="${sector(RM,R,a1,a2)}" fill="${fillMaj(i)}" stroke="#fff" stroke-width="3"/>`;
    o+=`<text x="${x.toFixed(1)}" y="${(y+22-up).toFixed(1)}" text-anchor="middle" fill="${txtMaj(i)}" font-size="66" font-weight="700">${m.n}</text>`;
    if(m.alt) o+=`<text x="${x.toFixed(1)}" y="${(y+52).toFixed(1)}" text-anchor="middle" fill="${txtMaj(i)}" fill-opacity=".7" font-size="30">${m.alt}</text>`;
    o+=`</g>`;
    const [u,v]=pt((RM+RC)/2,i*30);
    o+=`<g class="seg" data-ring="min" data-i="${i}"><path d="${sector(RC,RM,a1,a2)}" fill="${fillMin(i)}" stroke="#fff" stroke-width="3"/>`;
    o+=`<text x="${u.toFixed(1)}" y="${(v+14).toFixed(1)}" text-anchor="middle" fill="${txtMin(i)}" font-size="40" font-weight="700">${MIN[i]}m</text></g>`;
  }
  o+=`<circle cx="${CX}" cy="${CY}" r="${RC}" fill="#fff" stroke="#b9c6c4" stroke-width="4"/>`;
  if(!sel){
    o+=`<text x="${CX}" y="${CY-90}" text-anchor="middle" fill="#206f78" font-size="27" font-weight="700">Searah jarum jam</text>`;
    o+=`<text x="${CX}" y="${CY-50}" text-anchor="middle" fill="#17464f" font-size="26">tambah 1 kres (#)</text>`;
    o+=`<line x1="${CX-105}" y1="${CY}" x2="${CX+105}" y2="${CY}" stroke="#b9c6c4" stroke-width="2"/>`;
    o+=`<text x="${CX}" y="${CY+50}" text-anchor="middle" fill="#c4553a" font-size="27" font-weight="700">Berlawanan arah</text>`;
    o+=`<text x="${CX}" y="${CY+90}" text-anchor="middle" fill="#17464f" font-size="26">tambah 1 mol (b)</text>`;
  } else {
    const d=data(), sg=signature(d.notes);
    o+=`<text x="${CX}" y="${CY-62}" text-anchor="middle" fill="#206f78" font-size="46" font-weight="700">${d.title}</text>`;
    o+=`<text x="${CX}" y="${CY-18}" text-anchor="middle" fill="#17464f" font-size="25">${sg.txt}</text>`;
    if(sg.list.length) o+=`<text x="${CX}" y="${CY+16}" text-anchor="middle" fill="#17464f" font-size="22">${sg.list.join(" ")}</text>`;
    o+=`<line x1="${CX-105}" y1="${CY+42}" x2="${CX+105}" y2="${CY+42}" stroke="#b9c6c4" stroke-width="2"/>`;
    o+=`<text x="${CX}" y="${CY+82}" text-anchor="middle" fill="#c4553a" font-size="24" font-weight="700">${d.relLabel}</text>`;
  }
  o+=`<text x="${W/2}" y="${H-22}" text-anchor="middle" font-size="16" fill="#999">Oranye = key terpilih · oranye muda = chord diatonik di key itu · musicone</text>`;
  o+=`</svg>`;
  document.getElementById("chart").innerHTML=o;
  document.querySelectorAll("#chart .seg").forEach(g=>g.onclick=()=>{
    const ring=g.dataset.ring,i=+g.dataset.i;
    sel=(sel&&sel.ring===ring&&sel.i===i)?null:{ring,i,alt:false};
    render();
  });
  panel();
}
function data(){
  const i=sel.i;
  if(sel.ring==="maj"){
    const name=sel.alt&&MAJ[i].alt?MAJ[i].alt:MAJ[i].n, notes=scale(name,MAJ_STEPS);
    const q=["","m","m","","","m","dim"], rn=["I","ii","iii","IV","V","vi","vii°"];
    const ch=notes.map((n,d)=>n+q[d]);
    return {minor:false,name,title:`${name} mayor`,notes,rn,ch,relLabel:`Relative minor: ${notes[5]}m`,
      prog:[["I – IV – V – I",[0,3,4,0]],["I – V – vi – IV",[0,4,5,3]],["vi – IV – I – V",[5,3,0,4]],["ii – V – I",[1,4,0]],["I – vi – IV – V",[0,5,3,4]]]};
  }
  const majName=sel.alt&&MAJ[i].alt?MAJ[i].alt:MAJ[i].n, rel=scale(majName,MAJ_STEPS);
  let name=rel[5]; const notes=scale(name,MIN_STEPS);
  const q=["m","dim","","m","m","",""], rn=["i","ii°","III","iv","v","VI","VII"];
  const ch=notes.map((n,d)=>n+q[d]);
  const V=notes[4]+"7";
  return {minor:true,name,title:`${name} minor`,notes,rn,ch,relLabel:`Relative mayor: ${majName}`,V,
    prog:[["i – iv – v – i",[0,3,4,0]],["i – VI – III – VII",[0,5,2,6]],["i – VII – VI – VII",[0,6,5,6]],["i – iv – VII – III",[0,3,6,2]],["ii° – v – i",[1,4,0]]]};
}
function panel(){
  const p=document.getElementById("panel");
  if(!sel){p.innerHTML=`<h2>Lingkaran Kuint</h2>
    <p class="empty">Klik salah satu key di lingkaran.</p>
    <h3>Cara membaca</h3>
    <ul><li>Bergerak <b>searah jarum jam</b> = naik 1 kuint (5 nada), dan jumlah kres (#) bertambah 1.</li>
    <li>Bergerak <b>berlawanan arah</b> = naik 1 kuart, dan jumlah mol (b) bertambah 1.</li>
    <li>Key di <b>dalam</b> adalah relative minor: nadanya sama persis dengan key mayor di luarnya.</li>
    <li>Key yang <b>bersebelahan</b> hanya beda 1 nada, jadi enak dipakai untuk modulasi.</li>
    <li>Dalam satu key, chord diatonik selalu <b>berkumpul</b>: 3 kotak di luar dan 3 kotak di dalam.</li></ul>`;return;}
  const d=data(), sg=signature(d.notes), m=MAJ[sel.i];
  const swap=m.alt?`<button class="alt swap" id="swap">Lihat sebagai ${sel.ring==="maj"?(sel.alt?m.n:m.alt):(scale(sel.alt?m.n:m.alt,MAJ_STEPS)[5])}${sel.ring==="min"?" minor":" mayor"}</button>`:"";
  const funcs=d.minor?["Tonik","Subdominan","Tonik","Subdominan","Dominan","Subdominan","Dominan"]:["Tonik","Subdominan","Tonik","Subdominan","Dominan","Tonik","Dominan"];
  p.innerHTML=`<h2>${d.title}</h2>
    <div class="sig"><b>${sg.txt}</b>${sg.list.length?": "+sg.list.join(" "):""}</div>
    <div class="sig">${d.relLabel}</div>${swap}
    <h3>Tangga nada</h3>
    <div class="notes">${d.notes.map((n,k)=>`<span class="${k?"":"root"}">${n}</span>`).join("")}</div>
    <h3>Chord diatonik</h3>
    <table><tr><th></th><th>Chord</th><th>Fungsi</th></tr>
    ${d.ch.map((c,k)=>`<tr><td class="rn">${d.rn[k]}</td><td><b>${c}</b></td><td class="dim">${funcs[k]}</td></tr>`).join("")}</table>
    ${d.minor?`<p class="dim" style="font-size:13px;margin:8px 0 0">Di lagu minor, chord v sering diganti <b>${d.V}</b> (dari harmonic minor) supaya lebih kuat kembali ke ${d.ch[0]}.</p>`:""}
    <h3>Progresi populer</h3>
    <table>${d.prog.map(([r,ix])=>`<tr><td class="dim" style="font-family:Georgia,serif">${r}</td><td><b>${ix.map(k=>d.ch[k]).join(" – ")}</b></td></tr>`).join("")}</table>
    <h3>Scale untuk solo</h3>
    <ul>${d.minor
      ?`<li>${d.name} Natural Minor / ${d.name} Minor Pentatonic</li><li>${d.name} Blues untuk nuansa rock/blues</li><li>${d.name} Harmonic Minor saat chord ${d.V}</li>`
      :`<li>${d.name} Major / ${d.name} Major Pentatonic</li><li>${d.notes[5]} Minor Pentatonic juga cocok (nadanya sama)</li><li>${d.name} Mixolydian kalau ada chord ${d.notes[6].endsWith("#")?d.notes[6].slice(0,-1):d.notes[6]+"b"} mayor</li>`}</ul>`;
  const b=document.getElementById("swap"); if(b) b.onclick=()=>{sel.alt=!sel.alt;render();};
}
function fname(){return sel?("lingkaran-kuint-"+data().title.replace(/\s+/g,"-").replace(/#/g,"sharp")).toLowerCase():"lingkaran-kuint";}
function svgText(){return new XMLSerializer().serializeToString(document.querySelector("#chart svg"));}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
document.getElementById("reset").onclick=()=>{sel=null;render();};
document.getElementById("svg").onclick=()=>save(new Blob([svgText()],{type:"image/svg+xml"}),fname()+".svg");
document.getElementById("png").onclick=()=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const x=c.getContext("2d");x.scale(2,2);x.drawImage(img,0,0);c.toBlob(b=>save(b,fname()+".png"));};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgText());
};
render();
</script>
