<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Chart Generator</title>
<style>
:root{--bg:#eef2f2;--panel:#fff;--ink:#1f2a2a;--teal:#2a8c8c;--muted:#5b6b6b;--line:#d5dede}
@media (prefers-color-scheme:dark){:root{--bg:#141a1a;--panel:#1e2626;--ink:#e6eeee;--muted:#9fb0b0;--line:#2f3a3a}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}
.bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select{font:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--teal)}
.info{font-size:13px;color:var(--muted);flex-basis:100%;line-height:1.6}
.info b{color:var(--ink)}
main{padding:16px;display:flex;justify-content:center}
#chart{width:100%;max-width:820px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
#chart svg{display:block;width:100%;height:auto}
nav{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 4px}
nav a{font-size:14px;padding:6px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a[aria-current]{color:var(--teal);border-bottom-color:var(--teal);font-weight:bold}
</style>
</head>
<body>
<div class="bar">

  <label>Label<select id="mode"><option value="iv">Interval (R, △3, p5…)</option><option value="nt">Nama nada (G, B, D…)</option></select></label>
  <label>Tampilkan<select id="ghost"><option value="1">Bentuk chord + arpeggio</option><option value="0">Bentuk chord saja</option></select></label>
  <button id="png">Download PNG</button>
  <button id="svg" class="alt">Download SVG</button>
  <div class="info" id="info"></div>
</div>

const THIRDS=new Set(["m3","△3"]), SEVENTHS=new Set(["m7","△7","°7"]);
function spell(key,i,lb){
  const li=(LETTERS.indexOf(key[0])+DEG[lb]-1)%7, pc=(KEY_PC[key]+i)%12;
  const acc=((pc-NAT[li])%12+18)%12-6;
  return LETTERS[li]+(acc>0?"♯".repeat(acc):"♭".repeat(-acc));
}

// string index 0 = high e (top row), 5 = low E
const OPEN=[64,59,55,50,45,40];
// CAGED shapes: bass string carries the root; window = frets relative to that root fret
const SHAPES=[
  {n:"E",bass:5,lo:0,hi:3},
  {n:"A",bass:4,lo:0,hi:3},
  {n:"C",bass:4,lo:-3,hi:0},
  {n:"G",bass:5,lo:-3,hi:0},
  {n:"D",bass:3,lo:0,hi:3},
];
const ivOf=(s,f,root)=>((OPEN[s]+f-root)%12+12)%12;

function voicing(root,ch,sh){
  let f=((root-OPEN[sh.bass])%12+12)%12;
  if(f+sh.lo<0) f+=12;
  const lo=f+sh.lo, hi=f+sh.hi;
  const tones=new Map(ch.iv.map((v,i)=>[v%12,ch.lb[i]]));
  const req=[...tones.values()].filter(l=>!(ch.iv.length>=4&&l==="p5"));
  const opts=[];
  for(let s=sh.bass-1;s>=0;s--){
    const o=[-1];
    for(let fr=Math.max(lo,0);fr<=hi;fr++) if(tones.has(ivOf(s,fr,root))) o.push(fr);
    opts.push({s,o});
  }
  const cur=new Array(6).fill(-1); cur[sh.bass]=f;
  let best=null,bs=-Infinity;
  function score(){
    const snd=[];for(let s=0;s<6;s++) if(cur[s]>=0) snd.push(s);
    const cnt={};for(const s of snd){const l=tones.get(ivOf(s,cur[s],root));cnt[l]=(cnt[l]||0)+1;}
    for(const l of req) if(!cnt[l]) return -Infinity;
    const top=Math.min(...snd);
    let interior=0;for(let s=top+1;s<sh.bass;s++) if(cur[s]<0) interior++;
    if(interior>1) return -Infinity;
    const fretted=snd.filter(s=>cur[s]>0);
    let span=0,fingers=0;
    if(fretted.length){
      const fr=fretted.map(s=>cur[s]), minF=Math.min(...fr); span=Math.max(...fr)-minF;
      if(span>3) return -Infinity;
      const atMin=fretted.filter(s=>cur[s]===minF);
      let barre=atMin.length>=2;
      if(barre) for(let s=Math.min(...atMin);s<=Math.max(...atMin);s++) if(cur[s]<=0){barre=false;break;}
      fingers=(barre?1:atMin.length)+fretted.filter(s=>cur[s]>minF).length;
      if(fingers>4) return -Infinity;
    }
    let sc=10*snd.length-8*interior-0.6*span-0.2*fingers+0.3*snd.filter(s=>cur[s]===0).length;
    if(ch.iv.length>=4&&!cnt["p5"]&&tones.has(7)) sc-=2;
    for(const l in cnt){ if(THIRDS.has(l)&&cnt[l]>1) sc-=1.5*(cnt[l]-1); if(SEVENTHS.has(l)&&cnt[l]>1) sc-=3*(cnt[l]-1); }
    return sc;
  }
  (function rec(k){
    if(k===opts.length){const sc=score(); if(sc>bs){bs=sc;best=cur.slice();} return;}
    for(const fr of opts[k].o){cur[opts[k].s]=fr;rec(k+1);}
    cur[opts[k].s]=-1;
  })(0);
  return {shape:sh.n,frets:best,lo,hi,tones};
}

const W=1200,TOP0=290,GAP=318,SS=41,X0=210,X1=1080;
let H=0;
function render(){
  const key=KEYS[+keySel.value], ch=CHORDS[+chordSel.value], root=KEY_PC[key];
  const nameMode=modeSel.value==="nt", showGhost=ghostSel.value==="1";
  const lbOf=i=>ch.lb[ch.iv.findIndex(v=>v%12===i)];
  const rows=SHAPES.map(sh=>voicing(root,ch,sh)).sort((a,b)=>a.lo-b.lo);

  });

  H=top(4)+5*SS+140;
  const sym=key.replace("#","♯").replace(/^([A-G])b$/,"$1♭")+ch.s;
  const title=(key.replace("#","♯").replace(/^([A-G])b$/,"$1♭")+" "+ch.t.toUpperCase()+" CHORD");
  const fs=Math.min(44,620/(title.length*0.72));
  let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">`;
  o+=`<rect width="${W}" height="${H}" fill="#fff"/><rect width="${W}" height="200" fill="#2a8c8c"/>`;
  o+=`<svg x="75" y="52" width="380" height="81" viewBox="${LOGO_VB}"><path fill="#fff" fill-rule="evenodd" d="${LOGO_D}"/></svg>`;
  o+=`<text x="1150" y="95" text-anchor="end" fill="#fff" font-size="${fs.toFixed(1)}" font-weight="800" letter-spacing="1">${title}</text>`;
  o+=`<text x="1150" y="135" text-anchor="end" fill="#fff" font-size="20" letter-spacing="4">${sym} · 5 CAGED SHAPES</text>`;
  const inlays=[3,5,7,9,15,17,19,21].filter(f=>f<=N);
  rows.forEach((row,r)=>{
    const y=top(r), bh=5*SS;
    o+=`<rect x="100" y="${y-2}" width="44" height="${bh+12}" fill="#2b2b2b"/>`;
    o+=`<text transform="translate(129 ${y+bh/2+4}) rotate(-90)" text-anchor="middle" fill="#fff" font-size="17" letter-spacing="1">${row.shape} SHAPE</text>`;
    o+=`<rect x="${X0}" y="${y}" width="${X1-X0}" height="${bh}" fill="#f6f6f6"/>`;
    for(let f=1;f<=N;f++) o+=`<line x1="${X0+f*FW}" y1="${y}" x2="${X0+f*FW}" y2="${y+bh}" stroke="#c4c4c4" stroke-width="2"/>`;
    for(const f of inlays) o+=`<circle cx="${nx(f)}" cy="${y+bh/2}" r="8" fill="#cfcfcf"/>`;
    if(N>=12) for(const dy of [-SS,SS]) o+=`<circle cx="${nx(12)}" cy="${y+bh/2+dy}" r="8" fill="#cfcfcf"/>`;
    for(let s=0;s<6;s++) o+=`<line x1="${X0}" y1="${y+s*SS}" x2="${X1}" y2="${y+s*SS}" stroke="#9a9a9a" stroke-width="${1.5+s*0.4}"/>`;
    o+=`<rect x="${X0-3}" y="${y-2}" width="6" height="${bh+4}" fill="#111"/>`;
    for(const f of [3,5,7,9,12,15,17,19,21].filter(f=>f<=N)) o+=`<text x="${nx(f)}" y="${y+bh+45}" text-anchor="middle" font-size="21" fill="#333">${f}</text>`;
  });
  for(let r=0;r<rows.length-1;r++){
    const a=Math.max(rows[r].a,rows[r+1].a), b=Math.min(rows[r].b,rows[r+1].b);
    if(a>b) continue;
    const xa=nx(a)-(a===0?18:FW/2), xb=b===0?nx(0)+18:nx(b)+FW/2;
    o+=`<rect x="${xa}" y="${top(r)-20}" width="${xb-xa}" height="${top(r+1)+5*SS+40-top(r)}" fill="none" stroke="#f39a1e" stroke-width="3.5"/>`;
  }
  const txt=(i)=>nameMode?spell(key,i,lbOf(i)):lbOf(i);
  rows.forEach((row,r)=>{
    const y=top(r);
    if(showGhost) for(let s=0;s<6;s++) if(!row.frets||row.frets[s]>=0) for(let f=Math.max(row.lo,1);f<=row.hi;f++){
      const i=ivOf(s,f,root);
      if(!row.tones.has(i)||(row.frets&&row.frets[s]===f)) continue;
      const t=txt(i);
      o+=`<circle cx="${nx(f)}" cy="${y+s*SS}" r="15" fill="#fff" stroke="${i===0?"#f39a1e":"#8a8a8a"}" stroke-width="2"/>`;
      o+=`<text x="${nx(f)}" y="${y+s*SS+4.5}" text-anchor="middle" font-size="${t.length>2?10.5:12}" fill="${i===0?"#d9800f":"#666"}">${t}</text>`;
    }
    if(!row.frets){
      o+=`<text x="${(X0+X1)/2}" y="${y+5*SS/2+6}" text-anchor="middle" font-size="18" fill="#999">Tidak ada bentuk praktis untuk shape ini</text>`;
      return;
    }
    for(let s=0;s<6;s++){
      const f=row.frets[s], cy=y+s*SS;
      if(f<0){o+=`<text x="${X0-24}" y="${cy+7}" text-anchor="middle" font-size="22" fill="#9a9a9a">×</text>`;continue;}
      const i=ivOf(s,f,root), t=txt(i);
      o+=`<circle cx="${nx(f)}" cy="${cy}" r="17.5" fill="${i===0?"#f39a1e":"#1e1e1e"}" stroke="#fff" stroke-width="1.5"/>`;
      o+=`<text x="${nx(f)}" y="${cy+4.5}" text-anchor="middle" font-size="${t.length>2?11.5:13}" fill="#fff">${t}</text>`;
    }
  });
  const legend=(nameMode?`Orange = root (${spell(key,0,"R")})`:`R = root (${spell(key,0,"R")}) · △ = major · m = minor · p = perfect`)
    +(showGhost?` · ● = chord shape · ○ = other chord tones`:``)+` · × = muted · musicone`;
  o+=`<text x="${W/2}" y="${H-40}" text-anchor="middle" font-size="15" fill="#888">${legend}</text></svg>`;
  document.getElementById("chart").innerHTML=o;
  const tab=r=>r.frets?[5,4,3,2,1,0].map(s=>r.frets[s]<0?"x":r.frets[s]).join(" "):"–";
  document.getElementById("info").innerHTML=
    `<b>${sym}</b> &nbsp;·&nbsp; <b>Rumus:</b> ${ch.lb.join(" – ")} &nbsp;·&nbsp; <b>Nada:</b> ${ch.iv.map((v,i)=>spell(key,v%12,ch.lb[i])).join(" ")}<br>`+
